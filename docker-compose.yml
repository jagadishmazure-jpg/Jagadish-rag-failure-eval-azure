# Local PostgreSQL with pgvector for the vector-store bench.
#   docker compose up -d
#   PGVECTOR_DSN=postgresql://tessmoor:local-dev-only@localhost:5432/tessmoor
# The password is a local default. The Azure server in infra/vectorstores disables password auth.
services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tessmoor
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: tessmoor
    ports:
      - "5432:5432"
    volumes:
      - ./infra/pgvector/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessmoor -d tessmoor"]
      interval: 5s
      timeout: 5s
      retries: 10
