[project]
name = "rag-failure-eval"
version = "0.1.0"
description = "Inject and measure RAG failure modes on a synthetic corpus, with code-scored metrics and guards."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy==2.5.4"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4"]
measure = ["llama-cpp-python==0.3.36", "sentence-transformers==6.2.0", "torch==2.15.0"]
azure = ["azure-search-documents==12.0.0", "azure-identity==1.27.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ragfail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905", "N803", "N806"]
