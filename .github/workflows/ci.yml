# Offline CI: lint, tests, eval gate, documented-output drift, brand check, IaC checks, secret scan.
# Nothing here calls Azure or downloads model weights: dense embeddings, rerank scores and reader
# answers were measured once on CPU and are committed, so every metric replays exactly.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.13" }
      - name: Install (pinned)
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Synthetic corpus and questions match the generator
        run: python scripts/build_dataset.py --check
      - name: Tests (offline)
        run: python -m pytest -q
      - name: Test count
        run: python scripts/count_tests.py
      - name: Eval gate (recompute every metric and compare with results/)
        run: python scripts/run_eval.py --check
      - name: Documented output and numbers match a fresh run
        run: |
          python scripts/render_docs.py --check
          python scripts/check_numbers.py
      - name: No real brand names in code, docs or data
        run: python scripts/check_brands.py

  iac:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STACK: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: "1.16.4", terraform_wrapper: false }
      - name: terraform fmt / init / validate / test (mocked providers)
        run: |
          terraform -chdir="$STACK" fmt -check -recursive -diff
          terraform -chdir="$STACK" init -backend=false -input=false
          terraform -chdir="$STACK" validate
          terraform -chdir="$STACK" test
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with: { tflint_version: v0.64.0, github_token: "${{ github.token }}" }
      - name: tflint
        working-directory: ${{ env.STACK }}
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: tflint --init && tflint --format compact
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: checkov
        run: pip install --quiet checkov==3.3.20 && checkov -d "$STACK" --config-file .checkov.yaml
      - name: bicep build
        run: az bicep install && az bicep build --file infra/bicep/main.bicep --stdout > /dev/null

  secrets:
    # gitleaks over the full git history. Known false positives (public role IDs, synthetic
    # attack fixtures) are listed by fingerprint in .gitleaksignore.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
